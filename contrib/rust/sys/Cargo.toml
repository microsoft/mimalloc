[package]
name = "mimalloc-sys"
version = "3.7.2"
edition = "2021"
rust-version = "1.65"
license = "MIT"
description = "Raw bindings to the mimalloc memory allocator (builds and links the C library)"
repository = "https://github.com/microsoft/mimalloc"
keywords = ["mimalloc", "allocator", "malloc", "ffi"]
categories = ["memory-management", "external-ffi-bindings", "no-std"]
links = "mimalloc"
# a published crate should vendor the C sources in `mimalloc/` (see the readme)
include = ["/src", "/build.rs", "/README.md", "/mimalloc/LICENSE", "/mimalloc/include", "/mimalloc/src"]

[features]
default = []
# security mitigations (as cmake `-DMI_SECURE=ON`); with several secure features the highest level is used
secure = []
# cheap security mitigations: guard pages around metadata, randomization, encoded free lists, double free detection (as `-DMI_SECURE=BASIC`)
secure_basic = []
# `secure_basic` plus validated free pointers, stronger free list encoding, and randomized free lists (as `-DMI_SECURE=CHECKED`)
secure_checked = []
# also override the standard `malloc`, `free`, etc. in the final binary
override = []
# build mimalloc with assertions and internal invariant checks
debug = []
# as `debug` but only when `debug_assertions` are enabled
debug_in_debug = []
# use the local-dynamic TLS model (when mimalloc is part of a dynamically loaded library)
local_dynamic_tls = []
# disable transparent huge pages by default on Linux
no_thp = []
# use architecture specific optimizations (as cmake `-DMI_OPT_ARCH=ON`)
opt_arch = []
# use memory tagging (MTE) and require it at runtime (aarch64 Linux, Android, and macOS only; as cmake `-DMI_MTE=ON`);
# this also enables pointer authentication (PAC) (opt out with `MIMALLOC_DEFINES="MI_PAC=0"`)
mte = []
# sign internal pointers with pointer authentication (PAC) and require it at runtime (aarch64 Linux, Android, and macOS only; as cmake `-DMI_PAC=ON`)
pac = []

[build-dependencies]
cc = "1.2"
rustversion = "1"
